### Manual build Box64 with Github Action
name: Custom build Box64

on:
  workflow_dispatch:  
    inputs:
      platform: 
        description: 'Target platform name'
        required:  true
        default: 'GENERIC_ARM'
        type:  choice
        options:
        - X64
        - GENERIC_ARM
        - PHYTIUM
        - RK3326
        - RK3399
        - RK3588
        - RPI4ARM64
        - RPI5ARM64
        - SD845
        - SD888
        - ADLINK
        - TEGRAX1
        - ARM64
        - ANDROID_GLIBC
      build_type:
        description: 'Build type'
        required: true
        default:  'RelWithDebInfo'
        type: choice
        options: 
        - RelWithDebInfo
        - Release
        - Debug
        - MinSizeRel
      dynarec:
        description: 'Enable dynarec'
        required: false
        default: 'true'
        type: boolean
      box32:
        description:  'Enable box32'
        required:  false
        default:  'false'
        type:  boolean
      trace:
        description: 'Enable trace'
        required:  false
        default:  'false'
        type:  boolean
      wcp_files:
        description: 'Enable WCP files'
        required:  false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Box64 Repository"
        uses: actions/checkout@v4

      - name: "Environment preparation"
        run: |
          sudo apt-get update
          if [[ ${{ github.event.inputs.platform }} == 'ANDROID_GLIBC' ]]; then
            echo "BOX64_PLATFORM_MARCRO=-DARM64=1 -DWINLATOR_GLIBC=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1" >> $GITHUB_ENV
            echo "BOX64_COMPILER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            sudo apt-get -y install git gcc-aarch64-linux-gnu cmake make python3 patchelf
          elif [[ ${{ github.event. inputs.platform }} != 'X64' && ${{ github. event.inputs.platform }} != 'GENERIC_ARM' ]]; then
            echo "BOX64_PLATFORM_MARCRO=-D${{ github.event.inputs. platform }}=1" >> $GITHUB_ENV
            echo "BOX64_COMPILER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            sudo apt-get -y install git gcc-aarch64-linux-gnu cmake make python3
          else
            if [[ ${{ github.event.inputs.platform }} == 'X64' ]]; then
              echo "BOX64_PLATFORM_MARCRO=-DLD80BITS=1 -DNOALIGN=1" >> $GITHUB_ENV
              echo "BOX64_COMPILER=gcc" >> $GITHUB_ENV
              sudo apt-get -y install git cmake make python3
            else
              echo BOX64_PLATFORM_MARCRO="-DARM_DYNAREC=ON" >> $GITHUB_ENV
              echo "BOX64_COMPILER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              sudo apt-get -y install git gcc-aarch64-linux-gnu cmake make python3
            fi
          fi

      - name:  "Display Build info"
        run: |
          echo "CMake Platform Macro: ${{ env.  BOX64_PLATFORM_MARCRO }}"
          echo "CMake C Compiler: ${{ env.BOX64_COMPILER }}"
          echo "Build type: ${{ github.event.inputs.build_type }}"
          echo "Dynarec Enabled: ${{ github.event.inputs.dynarec }}"
          echo "Box32 Enabled:   ${{ github.event.inputs. box32 }}"
          echo "Trace Enabled: ${{ github.event.inputs.trace }}"
          echo "WCP Files Enabled: ${{ github. event.inputs.wcp_files }}"

      - name: "Build Box64"
        run:  |
          mkdir build
          cd build
          cmake .. -DCMAKE_C_COMPILER=${{ env.BOX64_COMPILER }} ${{ env.BOX64_PLATFORM_MARCRO }}\
                   -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }}\
                   -DARM_DYNAREC:BOOL=${{ github.event. inputs.dynarec }}\
                   -DBOX32:BOOL=${{ github.event. inputs.box32 }}\
                   -DHAVE_TRACE:BOOL=${{ github. event.inputs.trace }}\
                   -DWCP_FILES:BOOL=${{ github.event.inputs.wcp_files }}\
                   -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
          make -j$(nproc) VERBOSE=1

      - name: "Get short Git commit"
        id: git-info
        run: echo "SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: "Packaging WCP file for Winlator"
        if: github.event.inputs.platform == 'ANDROID_GLIBC' && github.event.inputs.wcp_files == 'true'
        run: |
          cd build
          cat <<EOF > profile.json
          {
            "type": "Box64",
            "versionName": "latest-${SHORT_COMMIT}",
            "versionCode": 1,
            "description": "Box64-latest-${SHORT_COMMIT}. Built from [https://github.com/ptitSeb/box64].",
            "files": [
              {
                "source": "box64",
                "target": "\${localbin}/box64"
              }
            ]
          }
          EOF
          patchelf --set-interpreter /data/data/com.winlator/files/imagefs/usr/lib/ld-linux-aarch64.so.1 ./box64
          tar --zstd -cf box64-latest.wcp box64 profile.json

      - name: "Upload WCP file"
        if: github.event.inputs.platform == 'ANDROID_GLIBC' && github.event.inputs.wcp_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: box64-${{ github.event.inputs.platform }}-${{ github.event.inputs.build_type }}-wcp
          path: build/box64-latest.wcp

      - name:  "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: box64-${{ github. event.inputs.platform }}-${{ github.event.inputs. build_type }}
          path:  build/box64
